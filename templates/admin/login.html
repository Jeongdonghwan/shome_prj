<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>관리자 로그인 | 세담홈케어</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="adm-body">
  <div class="adm-login">
    <div class="adm-card">
      <h1>세담홈케어 관리자</h1>
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <form method="post">
        <input type="text" name="admin_id" placeholder="아이디" autocomplete="username" required autofocus>
        <input type="password" name="admin_pw" placeholder="비밀번호" autocomplete="current-password" required>
        <button class="adm-btn" type="submit">로그인</button>
      </form>
    </div>
  </div>
</body>
</html>
